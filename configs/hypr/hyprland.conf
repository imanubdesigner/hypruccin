# Learn how to configure Hyprland: https://wiki.hypr.land/Configuring/

source = $HOME/.config/hypr/modules/monitors.conf
source = $HOME/.config/hypr/modules/autostart.conf
source = $HOME/.config/hypr/modules/windows.conf
source = $HOME/.config/hypr/modules/input.conf
source = $HOME/.config/hypr/modules/looknfeel.conf
source = $HOME/.config/hypr/modules/bindings/utilities.conf
source = $HOME/.config/hypr/modules/bindings/tiling.conf
source = $HOME/.config/hypr/modules/bindings/media.conf
source = $HOME/.config/hypr/modules/bindings/clipboard.conf
source = $HOME/.config/hypr/modules/apps.conf
source = $HOME/.config/hypr/modules/envs.conf
source = $HOME/.config/manu/current/theme/hyprland.conf


# Toggle config flags dynamically
source = ~/.local/state/manu/toggles/hypr/*.conf







